<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniTest CDN - Performance Intelligence Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============================================
           COMPLETE CSS - No external dependencies
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0a1a 0%, #0f0f2a 50%, #0a0a1a 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        /* App Container */
        .app-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #0f1535 0%, #0a0e27 100%);
            border-right: 1px solid rgba(79, 70, 229, 0.2);
            padding: 24px 16px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #4f46e5, #7c3aed);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-align: center;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(79, 70, 229, 0.2);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            margin: 4px 0;
            border-radius: 12px;
            color: #8b92b0;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-item:hover {
            background: rgba(79, 70, 229, 0.1);
            color: #ffffff;
        }

        .nav-item.active {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            padding: 24px 32px;
            min-height: 100vh;
        }

        /* Cards */
        .card {
            background: rgba(15, 21, 53, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(79, 70, 229, 0.2);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 24px;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(79, 70, 229, 0.2);
        }

        .card-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: rgba(15, 21, 53, 0.6);
            border: 1px solid rgba(79, 70, 229, 0.2);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: rgba(79, 70, 229, 0.5);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin: 8px 0;
        }

        .stat-label {
            font-size: 12px;
            color: #8b92b0;
        }

        /* Buttons */
        .btn-primary {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            border: none;
            padding: 12px 28px;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
        }

        .btn-secondary {
            background: rgba(30, 36, 72, 0.8);
            border: 1px solid rgba(79, 70, 229, 0.5);
            padding: 10px 24px;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }

        /* Inputs */
        .origin-input {
            padding: 14px 24px;
            background: rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(79, 70, 229, 0.3);
            border-radius: 48px;
            color: white;
            font-size: 14px;
            width: 320px;
        }

        .origin-input:focus {
            outline: none;
            border-color: #4f46e5;
        }

        /* Tables */
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }

        .data-table th,
        .data-table td {
            padding: 14px 12px;
            text-align: left;
            border-bottom: 1px solid rgba(79, 70, 229, 0.15);
        }

        .data-table th {
            color: #a5b4fc;
            font-weight: 500;
            font-size: 12px;
        }

        /* Hop Visualization */
        .hop-path {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            margin: 20px 0;
        }

        .hop-node {
            background: rgba(30, 36, 72, 0.4);
            border-radius: 16px;
            padding: 16px;
            min-width: 110px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .hop-node.critical {
            border: 2px solid #ef4444;
            background: rgba(239, 68, 68, 0.1);
        }

        .hop-node.warning {
            border: 2px solid #f59e0b;
            background: rgba(245, 158, 11, 0.05);
        }

        .hop-node.healthy {
            border: 2px solid #10b981;
        }

        .hop-latency {
            font-size: 20px;
            font-weight: 700;
            margin: 8px 0;
        }

        .hop-arrow {
            font-size: 24px;
            color: #4f46e5;
        }

        /* Gap Items */
        .gap-item {
            padding: 16px;
            background: rgba(30, 36, 72, 0.4);
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .code-block {
            background: #0a0a1a;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 11px;
            margin-top: 12px;
            overflow-x: auto;
        }

        /* Badges */
        .badge-critical { color: #ef4444; }
        .badge-high { color: #f59e0b; }
        .badge-medium { color: #eab308; }
        .badge-low { color: #10b981; }

        /* Loading */
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid rgba(79, 70, 229, 0.3);
            border-top-color: #4f46e5;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar { width: 80px; }
            .sidebar .logo { font-size: 20px; }
            .nav-item span:last-child { display: none; }
            .main-content { margin-left: 80px; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
        }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); position: fixed; transition: transform 0.3s; }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 16px; }
            .stats-grid { grid-template-columns: 1fr; }
            .hop-path { flex-direction: column; }
            .hop-arrow { transform: rotate(90deg); }
        }
    </style>
</head>

            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                bottom: 20px;
                right: 20px;
                padding: 12px 24px;
                background: ${type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#4f46e5'};

                border-radius: 8px;
                z-index: 10000;
                animation: slideIn 0.3s ease;
            `;

            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);

            if (target) localStorage.setItem('omnitest_default_target', target);
            if (iterations) localStorage.setItem('omnitest_iterations', iterations);
            if (llmProvider) localStorage.setItem('omnitest_llm_provider', llmProvider);
            
            showToast('Settings saved successfully!', 'success');
        }

        function loadSettings() {
            const savedTarget = localStorage.getItem('omnitest_default_target');
            const savedIterations = localStorage.getItem('omnitest_iterations');
            const savedProvider = localStorage.getItem('omnitest_llm_provider');
            
            if (savedTarget && document.getElementById('defaultTarget')) {
                document.getElementById('defaultTarget').value = savedTarget;
            }
            if (savedIterations && document.getElementById('defaultIterations')) {
                document.getElementById('defaultIterations').value = savedIterations;
            }
            if (savedProvider && document.getElementById('llmProvider')) {
                document.getElementById('llmProvider').value = savedProvider;
            }
        }

        function runPerformanceTest() {
            const target = document.getElementById('originUrl')?.value;
            if (!target) {
                showToast('Please enter a target URL', 'error');
                return;
            }
            
            const statusDiv = document.getElementById('testStatus');
            if (statusDiv) {
                statusDiv.innerHTML = '🔄 Testing in progress...';
                statusDiv.style.color = '#f59e0b';
            }
            
            // Simulate test execution
            setTimeout(() => {
                if (statusDiv) {
                    statusDiv.innerHTML = '✅ Test completed! Results updated below.';
                    statusDiv.style.color = '#10b981';
                    setTimeout(() => { statusDiv.innerHTML = ''; }, 3000);
                }
                
                // Update table with random but realistic data
                const tableBody = document.getElementById('regionTableBody');
                if (tableBody) {
                    const regions = [
                        { name: '🇺🇸 USA', latency: Math.floor(Math.random() * 50) + 50, hit: Math.floor(Math.random() * 15) + 85, status: '✅ Optimal' },
                        { name: '🇪🇺 Europe', latency: Math.floor(Math.random() * 60) + 60, hit: Math.floor(Math.random() * 20) + 80, status: '✅ Good' },
                        { name: '🌏 Asia Pacific', latency: Math.floor(Math.random() * 100) + 200, hit: Math.floor(Math.random() * 30) + 60, status: '⚠️ Bottleneck' },
                        { name: '🇮🇳 India', latency: Math.floor(Math.random() * 150) + 250, hit: Math.floor(Math.random() * 30) + 50, status: '🔴 Critical' },
                        { name: '🇦🇺 Australia', latency: Math.floor(Math.random() * 120) + 220, hit: Math.floor(Math.random() * 25) + 65, status: '⚠️ High Latency' }
                    ];
                    
                    tableBody.innerHTML = regions.map(r => `
                        <tr>
                            <td>${r.name}</td>
                            <td>${r.latency}ms</td>
                            <td>${r.hit}%</td>
                            <td style="color: ${r.status.includes('Optimal') ? '#10b981' : r.status.includes('Good') ? '#10b981' : '#f59e0b'}">${r.status}</td>
                        </tr>
                    `).join('');
                    
                    // Update stats
                    const avgLatency = Math.round(regions.reduce((a, b) => a + b.latency, 0) / regions.length);
                    const avgHit = Math.round(regions.reduce((a, b) => a + b.hit, 0) / regions.length);
                    
                    const globalLatencySpan = document.getElementById('globalLatency');
                    const cacheHitSpan = document.getElementById('cacheHit');
                    const healthSpan = document.getElementById('healthScore');
                    
                    if (globalLatencySpan) globalLatencySpan.innerText = `${avgLatency}ms`;
                    if (cacheHitSpan) cacheHitSpan.innerText = `${avgHit}%`;
                    if (healthSpan) healthSpan.innerText = `${Math.floor(avgHit - 10)}/100`;
                }
                
                showToast('Performance test completed!', 'success');
            }, 2000);
        }

        function traceNetworkPath() {
            const target = document.getElementById('traceTarget')?.value;
            const region = document.getElementById('traceRegion')?.value;
            
            if (!target) {
                showToast('Please enter a destination host', 'error');
                return;
            }
            
            const timelineDiv = document.getElementById('hopTimeline');
            const bottleneckDiv = document.getElementById('bottleneckInfo');
            
            if (!timelineDiv) return;
            
            // Define hops
            const hops = [
                { name: '🌐 Client', latency: 2, type: 'healthy' },
                { name: '🏢 ISP Gateway', latency: 5, type: 'healthy' },
                { name: '🔵 CDN Edge', latency: 12, type: 'healthy' },
                { name: '🔄 Load Balancer', latency: 23, type: 'healthy' },
                { name: '🏢 Origin Server', latency: 156, type: 'warning' },
                { name: '⚙️ Application', latency: 12, type: 'healthy' },
                { name: '💾 Cache', latency: 3, type: 'healthy' },
                { name: '🗄️ Database', latency: 6, type: 'healthy' },
                { name: `📍 ${target}`, latency: 89, type: 'healthy' }
            ];
            
            // Build timeline HTML
            let timelineHtml = '';
            hops.forEach((hop, index) => {
                timelineHtml += `
                    <div class="hop-node ${hop.type === 'warning' ? 'warning' : 'healthy'}">
                        <div>Hop ${index + 1}</div>
                        <div>${hop.name}</div>
                        <div class="hop-latency">${hop.latency}ms</div>
                    </div>
                `;
                if (index < hops.length - 1) {
                    timelineHtml += '<span class="hop-arrow">→</span>';
                }
            });
            
            timelineDiv.innerHTML = timelineHtml;
            
            // Bottleneck detection
            const bottleneckHop = hops.find(h => h.type === 'warning');
            if (bottleneckDiv && bottleneckHop) {
                bottleneckDiv.innerHTML = `
                    <div style="background: rgba(239,68,68,0.1); border-radius: 12px; padding: 16px; margin-top: 16px;">
                        <strong style="color: #ef4444;">🔴 Bottleneck Detected at ${bottleneckHop.name}</strong><br>
                        Latency: ${bottleneckHop.latency}ms<br>
                        Recommendation: Enable caching and consider origin shield configuration
                    </div>
                `;
            } else if (bottleneckDiv) {
                bottleneckDiv.innerHTML = `
                    <div style="background: rgba(16,185,129,0.1); border-radius: 12px; padding: 16px; margin-top: 16px;">
                        <strong style="color: #10b981;">✅ No bottlenecks detected</strong><br>
                        All hops are performing within acceptable thresholds.
                    </div>
                `;
            }
        }

        function startRecording() {
            if (currentRecording) {
                showToast('Recording already in progress', 'warning');
                return;
            }
            
            currentRecording = true;
            const statusDiv = document.getElementById('recordingStatus');
            if (statusDiv) {
                statusDiv.innerHTML = '🔴 Recording in progress... Click again to stop';
                statusDiv.style.color = '#ef4444';
            }
            
            let callCount = 0;
            recordingInterval = setInterval(() => {
                if (!currentRecording) return;
                callCount++;
                if (statusDiv) {
                    statusDiv.innerHTML = `🔴 Recording... ${callCount} API calls captured`;
                }
            }, 1000);
            
            showToast('Recording started! Perform your flow.', 'success');
        }

        function stopRecording() {
            if (!currentRecording) {
                showToast('No recording in progress', 'warning');
                return;
            }
            
            currentRecording = false;
            if (recordingInterval) {
                clearInterval(recordingInterval);
                recordingInterval = null;
            }
            
            const statusDiv = document.getElementById('recordingStatus');
            if (statusDiv) {
                statusDiv.innerHTML = '✅ Recording stopped. Session saved!';
                statusDiv.style.color = '#10b981';
                setTimeout(() => { statusDiv.innerHTML = ''; }, 3000);
            }
            
            showToast('Recording stopped! Session data saved.', 'success');
        }

        // ============================================
        // PAGE NAVIGATION
        // ============================================
        function loadPage(pageName) {
            const contentDiv = document.getElementById('mainContent');
            const pageContent = PAGES[pageName];
            
            if (!contentDiv || !pageContent) {
                console.error(`Page not found: ${pageName}`);
                return;
            }
            
            contentDiv.innerHTML = pageContent;
            
            // Re-attach event listeners after page load
            setTimeout(() => {
                // Dashboard events
                const runBtn = document.getElementById('runTestBtn');
                if (runBtn) {
                    runBtn.onclick = runPerformanceTest;
                }
                
                // Recorder events
                const startBtn = document.getElementById('startRecordingBtn');
                if (startBtn) {
                    startBtn.onclick = startRecording;
                }
                
                // Mesh events
                const traceBtn = document.getElementById('traceBtn');
                if (traceBtn) {
                    traceBtn.onclick = traceNetworkPath;
                    
                    // Auto-run trace on page load if target exists
                    if (document.getElementById('traceTarget')?.value) {
                        traceNetworkPath();
                    }
                }
                
                // Settings events
                const saveBtn = document.getElementById('saveSettingsBtn');
                if (saveBtn) {
                    saveBtn.onclick = saveSettings;
                }
                
                const testLLMBtn = document.getElementById('testLLMBtn');
                if (testLLMBtn) {
                    testLLMBtn.onclick = () => {
                        showToast('LLM connection test - Using local Ollama', 'info');
                    };
                }
                
                // Load saved settings
                loadSettings();
            }, 50);
        }

        // ============================================
        // INITIALIZATION
        // ============================================
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', () => {
                // Update active state
                document.querySelectorAll('.nav-item').forEach(nav => {
                    nav.classList.remove('active');
                });
                item.classList.add('active');
                
                // Load page
                const page = item.dataset.page;
                loadPage(page);
            });
        });
        
        // Load default dashboard
        loadPage('dashboard');
        
        // Mobile sidebar toggle (optional)
        const sidebar = document.getElementById('sidebar');
        if (sidebar && window.innerWidth <= 768) {
            sidebar.classList.add('open');
        }
        
        console.log('OmniTest CDN - Platform Ready');
    </script>
</body>
</html>
