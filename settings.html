<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - OmniTest CDN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',sans-serif;background:linear-gradient(135deg,#0a0a1a,#0f0f2a);color:#fff;padding:24px}.container{max-width:800px;margin:0 auto}.card{background:rgba(15,21,53,0.6);border-radius:20px;padding:24px;margin-bottom:24px;border:1px solid rgba(79,70,229,0.2)}.setting-item{margin-bottom:20px}label{display:block;margin-bottom:8px;color:#a5b4fc}input,select{width:100%;padding:12px;background:rgba(0,0,0,0.3);border:1px solid rgba(79,70,229,0.3);border-radius:12px;color:#fff}.btn-primary{background:linear-gradient(135deg,#4f46e5,#7c3aed);border:none;padding:12px 24px;border-radius:40px;color:#fff;cursor:pointer}
    </style>
</head>
<body>
    <div class="container"><h1 style="margin-bottom:24px">⚙️ Settings</h1>
    <div class="card"><h3>API Configuration</h3><div class="setting-item"><label>API Base URL</label><input type="text" id="apiUrl" placeholder="https://api.omnitest.com"></div>
    <div class="setting-item"><label>API Key</label><input type="password" id="apiKey" placeholder="Enter API key"></div></div>
    <div class="card"><h3>LLM Configuration</h3><div class="setting-item"><label>LLM Provider</label><select id="llmProvider"><option value="ollama">Ollama (Local)</option><option value="openai">OpenAI GPT-4</option><option value="anthropic">Anthropic Claude</option></select></div>
    <div class="setting-item"><label>API Key (for selected provider)</label><input type="password" id="llmApiKey" placeholder="Enter API key"></div>
    <button id="saveBtn" class="btn-primary">Save Settings</button></div></div>
    <script>document.getElementById('saveBtn').addEventListener('click',()=>{localStorage.setItem('api_url',document.getElementById('apiUrl').value);localStorage.setItem('api_key',document.getElementById('apiKey').value);localStorage.setItem('llm_provider',document.getElementById('llmProvider').value);alert('Settings saved!')})</script>
</body>
</html>
