<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>Origin Server Analysis</title><style>body{font-family:monospace;background:#0f0f2a;color:#fff;padding:16px}.metric{margin-bottom:16px;padding:12px;background:rgba(30,36,72,0.4);border-radius:8px}.value{font-size:24px;font-weight:700}</style></head>
<body><h3>🏢 Origin Server</h3><div class="metric"><div>Response Time</div><div class="value" id="response">78ms</div></div><div class="metric"><div>CPU Usage</div><div class="value" id="cpu">45%</div></div><div class="metric"><div>Memory Usage</div><div class="value" id="memory">62%</div></div><script>setInterval(()=>{document.getElementById('response').innerHTML=Math.floor(Math.random()*150)+50+'ms';document.getElementById('cpu').innerHTML=Math.floor(Math.random()*60)+20+'%';document.getElementById('memory').innerHTML=Math.floor(Math.random()*50)+30+'%'},3000);window.parent.postMessage({type:'FRAME_READY',frameId:'origin'},'*')</script></body>
</html>
